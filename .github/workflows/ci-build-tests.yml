name: build-tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
    # labeled: adding the full-ci label reruns the workflow on every OS. GitHub
    # cannot filter this event by label name, so any other label reruns it
    # unchanged; skipping the jobs instead would report a pass on the commit.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

# A new push or label on a pull request cancels the run still going for it;
# every other run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Ruff runs standalone: style and lint checks do not need the compiled
  # extension, so this job gives feedback in seconds.
  # Linux jobs run on ubuntu-24.04: on ubuntu-26.04 (GCC 15) the dtcc-mesher
  # native build fails 26 meshing tests. Remove the pin once dtcc-mesher is fixed.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check lint rules
        run: uvx ruff@0.16.8 check .

      - name: Check formatting
        run: uvx ruff@0.16.8 format --check .

  # Pull requests that only touch the process documents listed in the filter
  # step skip the test jobs below.
  # They skip through `if:`, which GitHub counts as a passing required check;
  # a `paths` filter on the workflow would leave those checks pending instead.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Look for changes outside documentation
        id: filter
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          changed=$(git diff --name-status --no-renames FETCH_HEAD HEAD)
          echo "$changed"
          # Added or modified files on this list are the only ones that skip
          # the tests: docs/ and DESIGN.md are read by tests, and a deleted
          # file can break packaging or tests.
          if echo "$changed" | grep -v \
              -e '^[AM][[:space:]]AGENTS\.md$' -e '^[AM][[:space:]]REVIEW\.md$' \
              -e '^[AM][[:space:]]CONTRIBUTING\.md$' -e '^[AM][[:space:]]README\.md$' \
              -e '^[AM][[:space:]]\.github/CODEOWNERS$' \
              -e '^[AM][[:space:]]\.github/pull_request_template\.md$' \
              -e '^[AM][[:space:]]\.github/workflows/claude'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    # Runs unless the changes job said no, so a failed changes job still tests.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      # macOS and Windows run only after merge or with the full-ci label, so a
      # failure on one must not cancel the other.
      fail-fast: false
      matrix:
        # Pull requests test on Ubuntu only. The merge commit on develop or
        # main, and a pull request carrying the full-ci label, test on all three.
        os: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["ubuntu-24.04", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # 1) Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Set up uv and Python
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      # 3) Install dtcc-core and development dependencies from uv.lock
      - name: Install dtcc-core
        run: |
          uv sync --locked

      # 4) Run tests
      - name: Run tests (macOS/Windows)
        if: matrix.os != 'ubuntu-24.04'
        run: |
          cd tests && uv run --locked pytest

      # 5) On Ubuntu only: run tests with coverage and verify public API calls
      - name: Run coverage and check public API calls
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cd tests
          uv run --locked pytest --maxfail=1 --disable-warnings --cov=dtcc_core \
            --cov-report=term-missing --cov-report=json:coverage.json
          cd ..
          uv run --locked python scripts/check_public_api_calls.py \
            --strict \
            --package dtcc_core \
            --coverage-file tests/coverage.json

      # Base-install tests above remain separate from the optional native backend.
      - name: Install volume-meshing dependencies
        run: uv sync --locked --extra volume

      - name: Require TetGen
        run: uv run --locked --extra volume python -c "from dtcc_core.builder.meshing.tetgen import is_tetgen_available; assert is_tetgen_available(), 'TetGen must be installed for volume-meshing tests'"

      - name: Test volume meshing
        run: |
          cd tests
          uv run --locked --extra volume pytest builder/test_meshing.py \
            builder/test_lod2_volume.py \
            'common/test_benchmark_lod2.py::test_quick_lod2_runner_and_exact_evidence_replay[city_volume_mesh]' \
            builder/test_cleaning_meshing_integration.py::test_build_city_volume_mesh_smoke \
            builder/test_cleaning_meshing_integration.py::test_build_city_volume_mesh_smoke_auto_lod_resolution \
            builder/test_cleaning_meshing_integration.py::test_city_volume_mesh_propagates_tetgen_failure \
            datasets/test_city_volume_mesh_dataset.py
        shell: bash

  python-compatibility:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python 3.14 build dependencies
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdal-dev

      - name: Install dtcc-core
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          cd tests && uv run --locked pytest

  # One required check for the ruleset in place of the matrix legs: a
  # skipped matrix job reports under its plain name, so leg names required
  # by the ruleset would stay pending on documentation-only pull requests.
  tests:
    needs: [changes, build-and-test, python-compatibility]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fail when a test job failed, was cancelled, or skipped although code changed
        if: >-
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        run: exit 1

  notify:
    needs: [build-and-test, python-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Push runs only: pull requests show their checks, and fork pull requests
    # have no webhook secret.
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Slack notification on success
        if: ${{ needs.build-and-test.result == 'success' && needs.python-compatibility.result == 'success' }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          NOTIFICATION_TITLE: "✅ *SUCCESS*"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GITHUB }}
        shell: bash
        run: |
          jq -n '{
            text: ([
              env.NOTIFICATION_TITLE,
              ("Repository: `" + env.GITHUB_REPOSITORY + "`"),
              ("Commit: `" + (env.COMMIT_SHA[0:7]) + "`"),
              ("Author: " + env.COMMIT_AUTHOR),
              ("Message: " + env.COMMIT_MESSAGE)
            ] | join("\n"))
          }' |
            curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK_URL"

      - name: Slack notification on failure
        if: ${{ needs.build-and-test.result == 'failure' || needs.python-compatibility.result == 'failure' }}
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          NOTIFICATION_TITLE: "❌ *FAILURE*"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEVELOPMENT }}
        shell: bash
        run: |
          jq -n '{
            text: ([
              env.NOTIFICATION_TITLE,
              ("Repository: `" + env.GITHUB_REPOSITORY + "`"),
              ("Commit: `" + (env.COMMIT_SHA[0:7]) + "`"),
              ("Author: " + env.COMMIT_AUTHOR),
              ("Message: " + env.COMMIT_MESSAGE)
            ] | join("\n"))
          }' |
            curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK_URL"
