name: build-tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  # Ruff runs standalone: style and lint checks do not need the compiled
  # extension, so this job gives feedback in seconds.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check lint rules
        run: uvx ruff@0.16.8 check .

      - name: Check formatting
        run: uvx ruff@0.16.8 format --check .

  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 1) Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Set up uv and Python
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      # 3) Install dtcc-core and development dependencies from uv.lock
      - name: Install dtcc-core
        run: |
          uv sync --locked

      # 4) Run tests
      - name: Run tests (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: |
          cd tests && uv run --locked pytest

      # 5) On Ubuntu only: run tests with coverage and verify public API calls
      - name: Run coverage and check public API calls
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd tests
          uv run --locked pytest --maxfail=1 --disable-warnings --cov=dtcc_core \
            --cov-report=term-missing --cov-report=json:coverage.json
          cd ..
          uv run --locked python scripts/check_public_api_calls.py \
            --strict \
            --package dtcc_core \
            --coverage-file tests/coverage.json

      # Base-install tests above remain separate from the optional native backend.
      - name: Install volume-meshing dependencies
        run: uv sync --locked --extra volume

      - name: Require TetGen
        run: uv run --locked --extra volume python -c "from dtcc_core.builder.meshing.tetgen import is_tetgen_available; assert is_tetgen_available(), 'TetGen must be installed for volume-meshing tests'"

      - name: Test volume meshing
        run: |
          cd tests
          uv run --locked --extra volume pytest builder/test_meshing.py \
            builder/test_cleaning_meshing_integration.py::test_build_city_volume_mesh_smoke \
            builder/test_cleaning_meshing_integration.py::test_build_city_volume_mesh_smoke_auto_lod_resolution \
            builder/test_cleaning_meshing_integration.py::test_city_volume_mesh_propagates_tetgen_failure \
            datasets/test_city_volume_mesh_dataset.py
        shell: bash

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python 3.14 build dependencies
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdal-dev

      - name: Install dtcc-core
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          cd tests && uv run --locked pytest

  contract-artifacts:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Build sdist and wheel
        run: |
          uv build --out-dir dist

      # Install the built wheel into a clean environment, outside the checkout,
      # so the test exercises the packaged artifact rather than the source tree.
      - name: Install wheel
        run: |
          uv venv "${RUNNER_TEMP}/wheel-env"
          uv pip install --python "${RUNNER_TEMP}/wheel-env" dist/dtcc_core-*.whl

      - name: Verify installed wheel
        run: |
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-env/bin/python" -c "import dtcc_core; import dtcc_core.datasets as datasets; assert datasets.list()"

      - name: Generate dataset contract artifacts
        run: |
          "${RUNNER_TEMP}/wheel-env/bin/python" scripts/generate_dataset_contract.py --output contract-artifacts

      - name: Upload wheel and dataset contract
        uses: actions/upload-artifact@v4
        with:
          name: dtcc-core-contract-${{ github.sha }}
          path: |
            dist/*.whl
            contract-artifacts/
          if-no-files-found: error

  dispatch-dtcc-sim:
    needs: [build-and-test, python-compatibility, contract-artifacts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dtcc-sim contract tests
        env:
          GH_TOKEN: ${{ secrets.DTCC_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/dtcc-platform/dtcc-sim/dispatches \
            --field event_type=dtcc-core-contract \
            --field "client_payload[core_sha]=${GITHUB_SHA}"

  dispatch-dtcc-upload:
    needs: [build-and-test, python-compatibility, contract-artifacts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dtcc-upload contract tests
        env:
          GH_TOKEN: ${{ secrets.DTCC_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          gh api \
            --method POST \
            repos/dtcc-platform/dtcc-upload/dispatches \
            --field event_type=dtcc-core-contract \
            --field "client_payload[core_sha]=${GITHUB_SHA}" \
            --field "client_payload[core_run_id]=${GITHUB_RUN_ID}"

  notify:
    needs: [build-and-test, python-compatibility, contract-artifacts, dispatch-dtcc-sim, dispatch-dtcc-upload]
    runs-on: ubuntu-latest
    if: always()  # always run even if build fails
    steps:
      - name: Slack notification on success
        if: ${{ needs.build-and-test.result == 'success' && needs.python-compatibility.result == 'success' && needs.contract-artifacts.result == 'success' && (needs.dispatch-dtcc-sim.result == 'success' || needs.dispatch-dtcc-sim.result == 'skipped') && (needs.dispatch-dtcc-upload.result == 'success' || needs.dispatch-dtcc-upload.result == 'skipped') }}
        run: |
          # Gather some info from the context
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_NAME="${{ github.repository }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          # Post to Slack (via webhook in secrets)
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ *SUCCESS*\nRepository: \`${REPO_NAME}\`\nCommit: \`${SHORT_SHA}\`\nAuthor: ${COMMIT_AUTHOR}\nMessage: ${COMMIT_MESSAGE}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL_GITHUB }}

      - name: Slack notification on failure
        if: ${{ needs.build-and-test.result == 'failure' || needs.python-compatibility.result == 'failure' || needs.contract-artifacts.result == 'failure' || needs.dispatch-dtcc-sim.result == 'failure' || needs.dispatch-dtcc-upload.result == 'failure' }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_NAME="${{ github.repository }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"❌ *FAILURE*\nRepository: \`${REPO_NAME}\`\nCommit: \`${SHORT_SHA}\`\nAuthor: ${COMMIT_AUTHOR}\nMessage: ${COMMIT_MESSAGE}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL_DEVELOPMENT }}
