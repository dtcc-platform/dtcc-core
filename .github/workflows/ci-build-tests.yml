name: build-tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 1) Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3) Install test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pytest pytest-cov httpx

      - name: Install dtcc-core
        run: |
          python -m pip install -e .

      # 4) Run tests (assuming pytest is used)
      - name: Run tests (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: |
          cd tests && pytest

      # 5) On Ubuntu only: run tests with coverage and verify public API calls
      - name: Run coverage and check public API calls
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd tests
          pytest --maxfail=1 --disable-warnings --cov=dtcc_core \
            --cov-report=term-missing --cov-report=json:coverage.json
          cd ..
          python scripts/check_public_api_calls.py \
            --strict \
            --package dtcc_core \
            --coverage-file tests/coverage.json

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python 3.14 build dependencies
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdal-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Run tests
        run: |
          cd tests && pytest

  contract-artifacts:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install wheel
        run: |
          python -m pip install dist/dtcc_core-*.whl

      - name: Verify installed wheel
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import dtcc_core; import dtcc_core.datasets as datasets; assert datasets.list()"

      - name: Generate dataset contract artifacts
        run: |
          python scripts/generate_dataset_contract.py --output contract-artifacts

      - name: Upload wheel and dataset contract
        uses: actions/upload-artifact@v4
        with:
          name: dtcc-core-contract-${{ github.sha }}
          path: |
            dist/*.whl
            contract-artifacts/
          if-no-files-found: error

  notify:
    needs: [build-and-test, python-compatibility, contract-artifacts]
    runs-on: ubuntu-latest
    if: always()  # always run even if build fails
    steps:
      - name: Slack notification on success
        if: ${{ needs.build-and-test.result == 'success' && needs.python-compatibility.result == 'success' && needs.contract-artifacts.result == 'success' }}
        run: |
          # Gather some info from the context
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_NAME="${{ github.repository }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          # Post to Slack (via webhook in secrets)
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ *SUCCESS*\nRepository: \`${REPO_NAME}\`\nCommit: \`${SHORT_SHA}\`\nAuthor: ${COMMIT_AUTHOR}\nMessage: ${COMMIT_MESSAGE}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL_GITHUB }}

      - name: Slack notification on failure
        if: ${{ needs.build-and-test.result == 'failure' || needs.python-compatibility.result == 'failure' || needs.contract-artifacts.result == 'failure' }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          REPO_NAME="${{ github.repository }}"
          COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
          COMMIT_MESSAGE="${{ github.event.head_commit.message }}"

          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"❌ *FAILURE*\nRepository: \`${REPO_NAME}\`\nCommit: \`${SHORT_SHA}\`\nAuthor: ${COMMIT_AUTHOR}\nMessage: ${COMMIT_MESSAGE}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL_DEVELOPMENT }}
