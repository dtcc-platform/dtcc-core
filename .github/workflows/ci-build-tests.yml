name: build-tests

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 1) Check out repository
      - name: Check out repository
        uses: actions/checkout@v4

      # 2) Set up uv and Python
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"
          enable-cache: true

      # 3) Install dtcc-core and development dependencies from uv.lock
      - name: Install dtcc-core
        run: |
          uv sync --locked

      # 4) Run tests
      - name: Run tests (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        run: |
          cd tests && uv run --locked pytest

      # 5) On Ubuntu only: run tests with coverage and verify public API calls
      - name: Run coverage and check public API calls
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd tests
          uv run --locked pytest --maxfail=1 --disable-warnings --cov=dtcc_core \
            --cov-report=term-missing --cov-report=json:coverage.json
          cd ..
          uv run --locked python scripts/check_public_api_calls.py \
            --strict \
            --package dtcc_core \
            --coverage-file tests/coverage.json

      # Base-install tests above remain separate from the optional native backend.
      - name: Install volume-meshing dependencies
        run: uv sync --locked --extra volume

      - name: Require TetGen
        run: uv run --locked --extra volume python -c "from dtcc_core.builder.meshing.tetgen import is_tetgen_available; assert is_tetgen_available(), 'TetGen must be installed for volume-meshing tests'"

      - name: Test volume meshing
        run: |
          cd tests
          uv run --locked --extra volume pytest builder/test_meshing.py \
            builder/test_cleaning_meshing_integration.py::test_build_city_volume_mesh_smoke \
            builder/test_cleaning_meshing_integration.py::test_build_city_volume_mesh_smoke_auto_lod_resolution \
            builder/test_cleaning_meshing_integration.py::test_city_volume_mesh_propagates_tetgen_failure \
            datasets/test_city_volume_mesh_dataset.py
        shell: bash

  python-compatibility:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Python 3.14 build dependencies
        if: matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgdal-dev

      - name: Install dtcc-core
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          cd tests && uv run --locked pytest

  notify:
    needs: [build-and-test, python-compatibility]
    runs-on: ubuntu-latest
    if: always()  # always run even if build fails
    steps:
      - name: Slack notification on success
        if: ${{ needs.build-and-test.result == 'success' && needs.python-compatibility.result == 'success' }}
        env:
          # head_commit exists only on push; pull_request runs use the PR head.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.event.pull_request.user.login }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          NOTIFICATION_TITLE: "✅ *SUCCESS*"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_GITHUB }}
        shell: bash
        run: |
          jq -n '{
            text: ([
              env.NOTIFICATION_TITLE,
              ("Repository: `" + env.GITHUB_REPOSITORY + "`"),
              ("Commit: `" + (env.COMMIT_SHA[0:7]) + "`"),
              ("Author: " + env.COMMIT_AUTHOR),
              ("Message: " + env.COMMIT_MESSAGE)
            ] | join("\n"))
          }' |
            curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK_URL"

      - name: Slack notification on failure
        if: ${{ needs.build-and-test.result == 'failure' || needs.python-compatibility.result == 'failure' }}
        env:
          # head_commit exists only on push; pull_request runs use the PR head.
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.event.pull_request.user.login }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
          NOTIFICATION_TITLE: "❌ *FAILURE*"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEVELOPMENT }}
        shell: bash
        run: |
          jq -n '{
            text: ([
              env.NOTIFICATION_TITLE,
              ("Repository: `" + env.GITHUB_REPOSITORY + "`"),
              ("Commit: `" + (env.COMMIT_SHA[0:7]) + "`"),
              ("Author: " + env.COMMIT_AUTHOR),
              ("Message: " + env.COMMIT_MESSAGE)
            ] | join("\n"))
          }' |
            curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data-binary @- \
              "$SLACK_WEBHOOK_URL"
