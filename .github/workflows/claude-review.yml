name: Claude review

# Reviews every non-draft pull request against REVIEW.md. The @claude mention
# workflow in claude.yml stays for follow-up questions. Needs the Claude GitHub
# App installed and ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a secret.
# Pull requests from forks have no access to secrets, so they are skipped.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Start by reading REVIEW.md with the Read tool; it is in the
            checked-out repository root. Get the diff with `gh pr diff` and
            the PR description with `gh pr view`.

            Review this pull request following REVIEW.md in the repository root:
            its "What failure looks like here", "Ignore", "How to review" and
            "How to report" sections. Check the diff against the PR's Testing,
            Risk and How to revert answers. Leave inline comments for findings
            and one top-level comment with the finding count or "no issues".
            On a synchronize event, review only the commits added since your
            last review comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
