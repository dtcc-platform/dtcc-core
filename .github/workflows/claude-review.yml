name: Claude review

# Reviews every non-draft pull request against REVIEW.md. The @claude mention
# workflow in claude.yml stays for follow-up questions. Needs the Claude GitHub
# App installed and ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a secret.
# Pull requests from forks have no access to secrets, so they are skipped.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The action checks out the PR head before reviewing, so REVIEW.md
      # would be the author's copy, or missing on a branch that predates it.
      - name: Read REVIEW.md from the default branch
        id: rules
        env:
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth=1 origin "$BASE"
          { echo 'review_md<<REVIEW_EOF'; git show FETCH_HEAD:REVIEW.md; echo 'REVIEW_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request following the REVIEW.md below: its
            "What failure looks like here", "Ignore", "How to review" and
            "How to report" sections. Get the diff with `gh pr diff` and the
            description with `gh pr view`. Check the diff against the PR's
            Testing, Risk and How to revert answers. Leave inline comments
            for findings and one top-level comment with the finding count or
            "no issues". On a synchronize event, review only the commits
            added since your last review comment; their diff comes from
            `gh api repos/${{ github.repository }}/compare/<old>...<new>`.

            REVIEW.md on ${{ github.event.repository.default_branch }}:

            ${{ steps.rules.outputs.review_md }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/dtcc-platform/dtcc-core/compare/*)"
