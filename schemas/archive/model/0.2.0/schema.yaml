id: https://github.com/dtcc-platform/dtcc-core/schemas/model
name: dtcc_model
version: 0.2.0
description: Standard DTCC semantic contract for canonical model exchange. Numerical
  arrays, topology, transforms and native typed state are admitted by Core. Unfamiliar
  classifications retain generic native meaning; known classifications receive the
  declared rules. This schema is self-contained.
see_also:
- https://docs.ogc.org/is/20-010/20-010.html
- https://www.cityjson.org/specs/2.0.2/
prefixes:
  dtcc: https://example.org/dtcc/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: dtcc
default_range: string
types:
  string:
    base: str
    uri: xsd:string
  float:
    base: float
    uri: xsd:double
slots:
  id:
    identifier: true
    required: true
    description: Projection-local identifier. Native Object IDs and generated geometry,
      region and field locators are namespaced to avoid collisions; Core admits original
      Object ID syntax and uniqueness without changing the stored IDs.
  parent:
    range: Entity
    required: false
    annotations:
      containment: true
classes:
  Entity:
    abstract: true
    slots:
    - id
  City:
    is_a: Object
    description: DTCC aggregate of city objects; CityJSON represents this at document
      level.
    annotations:
      dtcc_native_type: City
  Building:
    is_a: CityFeature
    description: Building entity, independent of the geometry used to represent it.
    slots:
    - parent
    slot_usage:
      parent:
        range: Object
    attributes:
      name:
        description: Optional human-readable name.
      measuredHeight:
        range: float
        minimum_value: 0
        description: Optional measured height in metres in this profile; not inferred
          from geometry.
      roofType:
        description: Optional source roof classification; no invented universal code
          list.
    annotations:
      dtcc_native_type: Building
  BuildingPart:
    is_a: Building
    description: Physical or functional subdivision of a building, retaining its own
      identity.
    slot_usage:
      parent:
        any_of:
        - range: Building
        - range: BuildingPart
    annotations:
      dtcc_native_type: BuildingPart
  SurfaceRegion:
    abstract: true
    is_a: Entity
    description: Semantic entity assigned to existing geometry elements. The projection's
      parent identifies the owning Building/BuildingPart or standalone Geometry; the
      semantic region does not become an extra native Object.
    slots:
    - parent
    slot_usage:
      parent:
        any_of:
        - range: Building
        - range: Geometry
  RoofSurface:
    is_a: SurfaceRegion
    description: Boundary delimiting a major roof part of a construction.
  WallSurface:
    is_a: SurfaceRegion
    description: Boundary delimiting an exterior lateral part of a construction.
  GroundSurface:
    is_a: SurfaceRegion
    description: Lower construction boundary in contact with the ground.
  FillingSurface:
    abstract: true
    is_a: SurfaceRegion
    description: Surface sealing an opening. This is not a physical filling-element
      Object. Ownership remains the Building/BuildingPart; host is a separate, optional
      region relationship. Missing host is not inferred from polygon holes.
    attributes:
      host:
        any_of:
        - range: WallSurface
        - range: RoofSurface
        description: Optional wall or roof region hosting this opening surface.
  Window:
    is_a: FillingSurface
    description: Window surface, using the CityJSON semantic spelling Window. Corresponds
      conceptually to CityGML 3.0 WindowSurface, not its physical Window feature.
  Door:
    is_a: FillingSurface
    description: Door surface, using the CityJSON semantic spelling Door. Corresponds
      conceptually to CityGML 3.0 DoorSurface, not its physical Door feature.
  CityFeature:
    abstract: true
    is_a: Object
    description: City object owning geometry representations; specialized classes
      refine its containment.
    slots:
    - parent
    slot_usage:
      parent:
        range: Object
    attributes:
      name:
        description: Optional human-readable source name.
  LandUse:
    is_a: CityFeature
    description: Area classified by use or cover. Source class/function/usage codes
      are retained without translating them to native LanduseClasses codes.
    attributes:
      nativeLanduses:
        multivalued: true
        range: NativeLanduseCode
        description: Explicit native Landuse.landuses enum names, when present; not
          source codes.
    annotations:
      dtcc_native_type: Landuse
  SolitaryVegetationObject:
    is_a: CityFeature
    description: Individual plant, including trees and bushes; does not imply native
      Tree.
    attributes:
      species:
        description: Optional source species name or code; no universal code list
          is assumed.
      height:
        range: float
        minimum_value: 0
        description: Optional height in metres in this profile; never inferred from
          absence.
      crownDiameter:
        range: float
        minimum_value: 0
        description: Optional crown diameter in metres, distinct from native crown
          radius.
      trunkDiameter:
        range: float
        minimum_value: 0
        description: Optional trunk diameter in metres.
  Tree:
    is_a: SolitaryVegetationObject
    description: Explicit DTCC tree classification; native measurements project without
      copying their authority.
    attributes:
      crownRadius:
        range: float
        minimum_value: 0
        description: Native crown_radius in metres, with no implicit diameter conversion.
    annotations:
      dtcc_native_type: Tree
  CityFurniture:
    is_a: CityFeature
    description: Outdoor furniture/equipment such as a bench, represented by generic
      Object.
  Object:
    is_a: Entity
    slots:
    - parent
    annotations:
      dtcc_native_type: Object
    description: Generic native object. Undeclared attributes and relationships retain
      their generic meaning; Core checks attribute structure and reference integrity.
  Geometry:
    is_a: Entity
    abstract: true
    description: Numerical geometry is validated by Core. Only semantic regions and
      field metadata are projected; coordinate buffers never enter LinkML.
  Mesh:
    is_a: Geometry
    annotations:
      dtcc_native_type: Mesh
  Point:
    is_a: Geometry
    annotations:
      dtcc_native_type: Point
  Surface:
    is_a: Geometry
    annotations:
      dtcc_native_type: Surface
  MultiSurface:
    is_a: Geometry
    annotations:
      dtcc_native_type: MultiSurface
  Solid:
    is_a: Geometry
    annotations:
      dtcc_native_type: Solid
  SemanticRegion:
    is_a: Entity
    slots:
    - parent
    annotations:
      dtcc_native_type: SemanticRegion
    attributes:
      host:
        range: Entity
    description: Generic assignment to geometry elements. Parent is the owning Object
      or standalone Geometry; host denotes the native region-parent index.
  Field:
    is_a: Entity
    annotations:
      dtcc_native_type: Field
    description: Numerical shape, component count and association with the owning
      geometry are validated by Core. These are the native descriptive metadata.
    attributes:
      name:
        description: Native field name.
      unit:
        description: Unit spelling supplied by the author; no implicit unit conversion.
      description:
        description: Native field description.
      association:
        description: Native association; admissible values and element counts are
          checked by Core.
  CityObject:
    is_a: Object
    description: Native DTCC CityObject; generic object rules, without a claim of
      CityGML equivalence.
    annotations:
      dtcc_native_type: CityObject
  Terrain:
    is_a: Object
    description: Native DTCC Terrain; generic object rules, without a claim of CityGML
      equivalence.
    annotations:
      dtcc_native_type: Terrain
  RoadNetwork:
    is_a: Object
    description: Native DTCC RoadNetwork; generic object rules, without a claim of
      CityGML equivalence.
    annotations:
      dtcc_native_type: RoadNetwork
  SensorCollection:
    is_a: Object
    description: Native DTCC SensorCollection; generic object rules, without a claim
      of CityGML equivalence.
    annotations:
      dtcc_native_type: SensorCollection
  VehicleCollection:
    is_a: Object
    description: Native DTCC VehicleCollection; generic object rules, without a claim
      of CityGML equivalence.
    annotations:
      dtcc_native_type: VehicleCollection
  DeSO:
    is_a: Object
    description: Native DTCC DeSO; generic object rules, without a claim of CityGML
      equivalence.
    annotations:
      dtcc_native_type: DeSO
  PointCloud:
    is_a: Geometry
    description: Native DTCC PointCloud. Numerical state and domain bounds are admitted
      by Core.
    annotations:
      dtcc_native_type: PointCloud
  VolumeMesh:
    is_a: Geometry
    description: Native DTCC VolumeMesh. Numerical state and domain bounds are admitted
      by Core.
    annotations:
      dtcc_native_type: VolumeMesh
  LineString:
    is_a: Geometry
    description: Native DTCC LineString. Numerical state and domain bounds are admitted
      by Core.
    annotations:
      dtcc_native_type: LineString
  MultiLineString:
    is_a: Geometry
    description: Native DTCC MultiLineString. Numerical state and domain bounds are
      admitted by Core.
    annotations:
      dtcc_native_type: MultiLineString
  Grid:
    is_a: Geometry
    description: Native DTCC Grid. Numerical state and domain bounds are admitted
      by Core.
    annotations:
      dtcc_native_type: Grid
  VolumeGrid:
    is_a: Geometry
    description: Native DTCC VolumeGrid. Numerical state and domain bounds are admitted
      by Core.
    annotations:
      dtcc_native_type: VolumeGrid
  Raster:
    is_a: Entity
    description: Native DTCC Raster; numerical state is admitted by Core.
    annotations:
      dtcc_native_type: Raster
  Bounds:
    is_a: Entity
    description: Native DTCC Bounds; numerical state is admitted by Core.
    annotations:
      dtcc_native_type: Bounds
  Transform:
    is_a: Entity
    description: Native DTCC Transform; numerical state is admitted by Core.
    annotations:
      dtcc_native_type: Transform
enums:
  NativeLanduseCode:
    description: Native DTCC computational code names, not a CityGML/CityJSON code
      list.
    permissible_values:
      WATER: {}
      GRASS: {}
      FOREST: {}
      FARMLAND: {}
      LIGHT_URBAN: {}
      URBAN: {}
      HEAVY_URBAN: {}
      INDUSTRIAL: {}
      MILITARY: {}
      ROAD: {}
      RAIL: {}
      UNKNOWN: {}
annotations:
  dtcc_open_semantics: true
