id: https://example.org/dtcc/profiles/city
name: dtcc_city
version: 0.2.0
description: >-
  Experimental DTCC mixed-city profile informed by CityGML 3.0 and CityJSON 2.0.2.
  This file is self-contained. It describes semantic records, not NumPy geometry
  buffers or the binary model envelope. Optional properties remain optional.
see_also:
  - https://docs.ogc.org/is/20-010/20-010.html
  - https://www.cityjson.org/specs/2.0.2/
prefixes:
  dtcc: https://example.org/dtcc/
  xsd: http://www.w3.org/2001/XMLSchema#
default_prefix: dtcc
default_range: string
# Inline the scalar definitions so this exact profile has no imported files or
# remotely resolved types. These are LinkML primitive declarations.
types:
  string:
    base: str
    uri: xsd:string
  float:
    base: float
    uri: xsd:double
slots:
  id:
    identifier: true
    required: true
  parent:
    range: Entity
    required: true
    annotations:
      containment: true
classes:
  Entity:
    abstract: true
    slots: [id]
  City:
    is_a: Entity
    description: DTCC aggregate of city objects; CityJSON represents this at document level.
  Building:
    is_a: CityFeature
    description: Building entity, independent of the geometry used to represent it.
    slots: [parent]
    slot_usage:
      parent:
        range: City
    attributes:
      name:
        description: Optional human-readable name.
      measured_height:
        range: float
        minimum_value: 0
        description: Optional measured height in metres in this profile; not inferred from geometry.
      roof_type:
        description: Optional source roof classification; no invented universal code list.
  BuildingPart:
    is_a: Building
    description: Physical or functional subdivision of a building, retaining its own identity.
    slot_usage:
      parent:
        any_of:
          - range: Building
          - range: BuildingPart
  SurfaceRegion:
    abstract: true
    is_a: Entity
    description: >-
      Semantic entity assigned to existing geometry elements. The projection's
      parent identifies the owning Building/BuildingPart, not an extra native node.
    slots: [parent]
    slot_usage:
      parent:
        range: Building
  RoofSurface:
    is_a: SurfaceRegion
    description: Boundary delimiting a major roof part of a construction.
  WallSurface:
    is_a: SurfaceRegion
    description: Boundary delimiting an exterior lateral part of a construction.
  GroundSurface:
    is_a: SurfaceRegion
    description: Lower construction boundary in contact with the ground.
  FillingSurface:
    abstract: true
    is_a: SurfaceRegion
    description: >-
      Surface sealing an opening. This is not a physical filling-element Object.
      Ownership remains the Building/BuildingPart; host is a separate, optional
      region relationship. Missing host is not inferred from polygon holes.
    attributes:
      host:
        any_of:
          - range: WallSurface
          - range: RoofSurface
        description: Optional wall or roof region hosting this opening surface.
  Window:
    is_a: FillingSurface
    description: >-
      Window surface, using the CityJSON semantic spelling Window. Corresponds
      conceptually to CityGML 3.0 WindowSurface, not its physical Window feature.
  Door:
    is_a: FillingSurface
    description: >-
      Door surface, using the CityJSON semantic spelling Door. Corresponds
      conceptually to CityGML 3.0 DoorSurface, not its physical Door feature.
  CityFeature:
    abstract: true
    is_a: Entity
    description: City object owning geometry representations; specialized classes refine its containment.
    slots: [parent]
    slot_usage:
      parent:
        range: City
    attributes:
      name:
        description: Optional human-readable source name.
  LandUse:
    is_a: CityFeature
    description: >-
      Area classified by use or cover. Source class/function/usage codes are
      retained without translating them to native LanduseClasses codes.
    attributes:
      native_landuses:
        multivalued: true
        range: NativeLanduseCode
        description: Explicit native Landuse.landuses enum names, when present; not source codes.
  SolitaryVegetationObject:
    is_a: CityFeature
    description: Individual plant, including trees and bushes; does not imply native Tree.
    attributes:
      species:
        description: Optional source species name or code; no universal code list is assumed.
      height:
        range: float
        minimum_value: 0
        description: Optional height in metres in this profile; never inferred from absence.
      crown_diameter:
        range: float
        minimum_value: 0
        description: Optional crown diameter in metres, distinct from native crown radius.
      trunk_diameter:
        range: float
        minimum_value: 0
        description: Optional trunk diameter in metres.
  Tree:
    is_a: SolitaryVegetationObject
    description: Explicit DTCC tree classification; native measurements project without copying their authority.
    attributes:
      crown_radius:
        range: float
        minimum_value: 0
        description: Native crown_radius in metres, with no implicit diameter conversion.
  CityFurniture:
    is_a: CityFeature
    description: Outdoor furniture/equipment such as a bench, represented by generic Object.
enums:
  NativeLanduseCode:
    description: Native DTCC computational code names, not a CityGML/CityJSON code list.
    permissible_values:
      WATER: {}
      GRASS: {}
      FOREST: {}
      FARMLAND: {}
      LIGHT_URBAN: {}
      URBAN: {}
      HEAVY_URBAN: {}
      INDUSTRIAL: {}
      MILITARY: {}
      ROAD: {}
      RAIL: {}
      UNKNOWN: {}
