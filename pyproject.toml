[build-system]
requires = ["scikit-build-core", "pybind11==3.0.*", "wheel", "ninja"]
build-backend = "scikit_build_core.build"

[project]
dependencies = [
    "fiona >= 1.8.0, < 2.0.0",
    "affine",
    "geopandas >= 1.0.1",
    "laspy[lazrs] >= 2.3.0, < 3.0.0",
    "matplotlib >= 3.7.0, < 4.0.0",
    "meshio >= 5.0.0, < 6.0.0",
    "numpy >= 1.20.0, < 3.0.0",
    "pillow >= 9.0.0, < 12.0.0",
    "protobuf >= 5.29.0, < 6.0.0",
    "psutil",
    "pyassimp",
    "pygltflib",
    "pypoints2grid >= 0.1.9",
    "pyproj >= 3.1.0, < 4.0.0",
    "rasterio >= 1.2.0, < 2.0.0",
    "rasterstats >= 0.19.0, < 1.0.0",
    "scikit-image>=0.25.2",
    "scipy >= 1.13.0, < 2.0.0",
    "shapely >= 2.0.0, < 3.0.0",
    "tqdm>=4.66.1",
    "requests",
    "platformdirs",
    "aiohttp",
    "folium",
    "gtfs-realtime-bindings >= 2.0.0, < 3.0.0",
    "h5py == 3.16.0",
    "polyforge == 0.1.0a9",
    "pydantic>=2.12.5",
    "linkml==1.11.1",
    "linkml-runtime==1.11.1",
    "rich>=13.0.0",
    "dtcc-mesher @ git+https://github.com/dtcc-platform/dtcc-mesher.git@d9643e735097c719ebeab8bacc06f4ed1f9ae042",
]

version = "0.9.8dev"
name = "dtcc-core"
description = "DTCC Core"
readme = "README.md"
authors = [
    { name = "Anders Logg", email = "logg@chalmers.se" },
    { name = "Vasilis Naserentin", email = "vasilis.naserentin@chalmers.se" },
    { name = "Dag Wästberg", email = "dwastberg@gmail.com" },
    { name = "George Spaias", email = "gspaiasa@ece.auth.gr" },
    { name = "Jens Olsson", email = "jens.olsson@chalmersindustriteknik.se" },
]
requires-python = ">=3.11"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest>=9.0.2", "pytest-cov", "httpx>=0.27"]
remote = ["httpx>=0.27"]
volume = ["dtcc-tetgen-wrapper @ git+https://github.com/dtcc-platform/dtcc-tetgen-wrapper.git@22ab9ff2ee1dd03f82ce24dd0f378f00da7e487c"]

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
# Wheels carry the extension and notices; source archives retain the native tree.
wheel.exclude = ["dtcc_core/cpp/**", "dtcc_core/CMakeLists.txt"]
wheel.license-files = ["LICENSE", "licenses/*"]
sdist.exclude = ["**/.DS_Store", "git-loc-history-*.png"]
# Keep CMake build trees between builds so `uv sync` recompiles incrementally.
build-dir = "build/{wheel_tag}"

[tool.uv]
# `uv sync` installs dtcc-core in editable mode, which only picks up Python
# changes. Reinstall (and recompile) when the native build inputs change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "CMakeLists.txt" },
    { file = "dtcc_core/CMakeLists.txt" },
    { file = "dtcc_core/cpp/dtcc_builder.cpp" },
    { file = "dtcc_core/cpp/include/**/*" },
    { file = "dtcc_core/cpp/external/**/*" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "pytest>=9.0.2",
    "pytest-cov",
    "httpx>=0.27",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Scratch code, agent plans, prose and generated bindings are not ours to format.
extend-exclude = ["sandbox", ".agent", "docs", "*.md", "*_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "PLR0915"]
# The formatter decides line breaks, so E501 would only report the lines it
# cannot split, such as long strings and comments.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Package inits re-export names and their import order is load-bearing: some
# subpackages import back from their parent, so sorting creates import cycles.
"**/__init__.py" = ["I001", "F401"]
